name: build-e54c-image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev zstd

      - name: Fetch upstream checksum
        id: checksum
        run: |
          curl -fsSL -o sha256sums https://fw.koolcenter.com/iStoreOS/ib/rk3xxx/sha256sums
          echo "key=$(sha256sum sha256sums | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache ImageBuilder tarball
        id: cache-ib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: imagebuilder.tar.zst
          key: imagebuilder-rk3xxx-${{ steps.checksum.outputs.key }}

      - name: Download ImageBuilder
        if: steps.cache-ib.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o imagebuilder.tar.zst \
            https://fw.koolcenter.com/iStoreOS/ib/rk3xxx/istoreos-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst

      - name: Verify checksum
        run: |
          expected=$(grep 'istoreos-imagebuilder-rockchip-armv8' sha256sums | cut -d' ' -f1)
          actual=$(sha256sum imagebuilder.tar.zst | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "checksum mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi

      - name: Extract ImageBuilder
        run: |
          tar --use-compress-program=unzstd -xf imagebuilder.tar.zst
          mv istoreos-imagebuilder-* imagebuilder

      - name: Build image
        run: |
          packages=$(grep -v '^#' packages.txt | xargs)
          cp -r files imagebuilder/files
          cd imagebuilder
          make image PROFILE=radxa_e54c PACKAGES="$packages" FILES=files
          ls -la bin/targets/rockchip/armv8/

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: istoreos-e54c-image
          path: imagebuilder/bin/targets/rockchip/armv8/*.img.gz
          retention-days: 7
          if-no-files-found: error
